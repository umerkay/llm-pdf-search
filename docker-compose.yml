services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow/airflow_home
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      PAPERS_DIR: /opt/airflow/ResearchLibrary/papers
      OUTPUT_DIR: /opt/airflow/ResearchLibrary/output
      DATABASE_PATH: /opt/airflow/data/papers.db
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1235/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      OPENAI_MODEL: ${OPENAI_MODEL:-local-model}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ResearchLibrary:/opt/airflow/ResearchLibrary
      - ./data:/opt/airflow/data
      - ./airflow_home:/opt/airflow/airflow_home
    restart: unless-stopped
